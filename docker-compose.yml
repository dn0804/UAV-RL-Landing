services:
  uav_dev:
    build: .
    container_name: uav_rl_container
    network_mode: "host"
    stdin_open: true 
    tty: true        
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
    volumes:
      - ./:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: /bin/bash